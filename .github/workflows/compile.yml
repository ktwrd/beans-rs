name: Compile

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
   contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      
      - name: Install Build Dependencies (ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update;
          sudo apt-get install -y \
            g++ \
            gdb \
            git \
            make \
            cmake \
            autoconf \
            libx11-dev \
            libglu1-mesa-dev \
            libxft-dev \
            libxcursor-dev \
            libasound2-dev \
            freeglut3-dev \
            libcairo2-dev \
            libfontconfig1-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libpango1.0-dev \
            libxinerama-dev \
            libfltk1.3 \
            libfltk1.3-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-09
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        id: build
        run: |
          json=$(cargo build --verbose --target ${{ matrix.target }} --message-format=json-render-diagnostics "$@") && \
          binary=$(printf "%s" "$json" | jq -js '[.[] | select(.reason == "compiler-artifact") | select(.executable != null)] | last | .executable')
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Code Signing (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        uses: skymatic/code-sign-action@v3
        with:
          certificate: '${{ secrets.CODESIGN }}'
          password: '${{ secrets.CODESIGN_PASSWORD }}'
          folder: 'target/${{ matrix.target }}/debug'
          description: 'Open-Source Installer for Sourcemods'
          certificatesha1: '${{ secrets.CODESIGN_HASH }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ steps.build.outputs.binary }}
