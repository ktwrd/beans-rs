name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Github Release Tag'
        required: true
        type: string
      game_branch:
        description: 'Game branch to compile'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - game/tf2c
          # - game/pf2
      name:
        description: 'Name of the program (default: beans-rs)'
        required: false
        default: 'beans-rs'
        type: string

run-name: Release ${{ inputs.tag }} (${{ inputs.game_branch }})

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            filename: '${{ inputs.name}}'
            target: x86_64-unknown-linux-gnu

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            filename: '${{ inputs.name}}.exe'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.game_branch }}

      - name: Install Build Dependencies (ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update;
          sudo apt-get install -y \
            g++ \
            gdb \
            git \
            make \
            cmake \
            autoconf \
            libx11-dev \
            libglu1-mesa-dev \
            libxft-dev \
            libxcursor-dev \
            libasound2-dev \
            freeglut3-dev \
            libcairo2-dev \
            libfontconfig1-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libpango1.0-dev \
            libxinerama-dev \
            libfltk1.3 \
            libfltk1.3-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-01-10
          targets: ${{ matrix.target }}

      - name: Compile ${{ matrix.filename }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Code Signing (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        uses: skymatic/code-sign-action@v3
        with:
          certificate: '${{ secrets.CODESIGN }}'
          password: '${{ secrets.CODESIGN_PASSWORD }}'
          folder: 'target/${{ matrix.target }}/release'
          description: '${{ inputs.name}}'
          certificatesha1: '${{ secrets.CODESIGN_HASH }}'

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.filename }}
          tag_name: ${{ github.event.inputs.tag }}
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}

      #- name: Create Sentry release
      #  if: ${{ matrix.os == 'ubuntu-latest' }}
