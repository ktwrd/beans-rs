[package]
name = "beans-core"
version = "1.7.4"
edition = "2024"
repository = "https://github.com/ktwrd/beans-rs"
license = "GPL-3.0-only"

[dependencies]
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
lazy_static = "1.5.0"
log = "0.4.33"
rand = "0.10.2"
simple-home-dir = "0.5.2"
rust-i18n = "4"

[dependencies.reqwest]
version = "0.13.4"
features = [
    "multipart",
    "stream",
    "json",

    "charset",
    "http2"
]
default-features = false

[dependencies.sentry]
version = "0.49.1"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "release-health",

    "reqwest",
    "rustls",

    "logs",
    "log"
]

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0.5"

[package.metadata.i18n]
default-locale = "en"
load-path = "../locales"