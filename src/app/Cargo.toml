[package]
name = "beans-rs"
version = "1.7.4"
edition = "2024"
authors = [
    "Kate Ward <kate@dariox.club>",
    "ToastXC <contact@toastxc.xyz>",
    "Sour Dani <dani@prefortress.com>",
    "dead_thing (https://github.com/rawra89)"
]
description = "Open-Source Installer for Sourcemods"
repository = "https://github.com/ktwrd/beans-rs"
license = "GPL-3.0-only"

[dependencies]
async-recursion = "1.1.1"
async-stream = "0.3.6"
const_format = "0.2.36"
futures = "0.3.33"
futures-util = "0.3.33"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tar = "0.4.46"
tokio-util = { version= "0.7.17", features = ["io"] }
zstd = "0.13.3"
include-flate = "0.3.4"
simple-home-dir = "0.5.2"
clap = { version = "4.6.6", features = ["cargo"] }
bitflags = "2.13.1"
log = "0.4.33"
lazy_static = "1.5.0"
thread-id = "5.1.0"
colored = "3.1.1"
sentry-log = "0.49.1"
chrono = "0.4.45"

fltk = { version = "1.5.23", features = ["fltk-bundled"] }
fltk-theme = "0.7.9"
dark-light = "2.0.0"
image = { version = "0.25.10", features = ["png"] }
valve_pak = "0.1.0"
current_platform = "0.2.0"
beans-bins = { path = "../beans-bins" }
beans-core = { path = "../beans-core" }
rust-i18n = "4"

[build-dependencies]
fl2rust = "0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
winconsole = { version = "0.11.1", features = ["window"] }
winreg = "0.56.0"
widestring = "1.2.1"
windows = { version = "0.62.2", features = ["Win32_System_IO", "Win32_Storage_FileSystem"] }
dunce = "1.0.5"

[dependencies.tokio]
version = "1.53.1"
features = [
    "macros",
    "rt-multi-thread"
]

[dependencies.reqwest]
version = "0.13.4"
features = [
    "multipart",
    "stream",
    "json",

    "charset",
    "http2"
]
default-features = false

[dependencies.sentry]
version = "0.49.1"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "release-health",

    "reqwest",
    "rustls",

    "logs",
    "log"
]

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 1
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = false

[package.metadata.i18n]
default-locale = "en"
load-path = "locales"