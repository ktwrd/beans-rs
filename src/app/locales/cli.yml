_version: 2
commands:
  wizard.about:
      en: "Use the wizard to install. (Default subcommand)"
  install:
    about:
      en: "Install to a custom location."
    from: 
      en: "Location to where the .tar.zstd file is that you want to install from."
    target:
      en: "Specify the version to install. Ignored when [--from] is used."
  verify.about:
    en: "Verify your current installation"
  update.about:
    en: "Update your installation"
  clean.about:
    en: "Clean up temporary files used by beans"
  uninstall.about:
      en: "Uninstall the target Source Mod."
args:
  debug.about:
    en: "Enable debug logging"
  no-debug.about:
    en: "Disable mode. Mainly used for debug builds to not spew into the console."
  no-pause.about:
    en: "When provided, beans-rs will not wait for user input before exiting. It is suggested that server owners use this for any of their scripts."
    
intro:
  contributor_list:
    en: "For a full list of contributors visit:"
  new_version:
    en: "A new version of beans-rs is available!"
    