_version: 2
# IMPORTANT: Do not translate any values inside of %{}

commands:
  wizard.about:
      en: "Use the wizard to install. (Default subcommand)"
  install:
    about:
      en: "Install to a custom location."
    from: 
      en: "Location to where the .tar.zstd file is that you want to install from."
    target:
      en: "Specify the version to install. Ignored when [--from] is used."
  verify.about:
    en: "Verify your current installation"
  update.about:
    en: "Update your installation"
  clean.about:
    en: "Clean up temporary files used by %{program}"
  uninstall.about:
      en: "Uninstall the target Source Mod (%{game})."

tasks:
  install:
    from_to:
      en: "Manually installing from %{previous} to %{current}"
      
args:
  debug.about:
    en: "Enable debug logging"
  no-debug.about:
    en: "Disable mode. Mainly used for debug builds to not spew into the console."
  no-pause.about:
    en: "When provided, %{program} will not wait for user input before exiting. It is suggested that server owners use this for any of their scripts."
  location.about:
    en: "Manually specify sourcemods directory. When not provided, %{program} will automatically detect the sourcemods directory."
  confirm.about:
    en: "When prompted to do something (as a multi-choice option), the default option will be automatically chosen when this switch is provided, and there is a default multi-choice option available."
    
intro:
  contributor_list:
    en: "For a full list of contributors visit:"
  new_version:
    en: "A new version of %{program} is available!"
    
debug:
  enabled:
    en: "Enabled Debug Mode"
  disabled:
    en: "Disabled Debug Mode"

info:
  found:
    args:
      en: "Found in arguments! %{item}"
  press_enter:
    en: "Press enter/return to exit"

error:
  directory:
    create.failure:
      en: "Failed to create directory"
  console:
    title.failure:
      en: "Failed to set console title"
    flag.failure:
      en: "Failed to disable console flag %{flag}"
  msgbox:
    en: "Showing MsgBox to notify user"
  fatal:
    en: "Fatal error!"
  calling.handler:
    en: "Calling panic handler %{handler}"
  full:
    en: "Full Error"
  run.failure:
    en: "Failed to run %{task}"
  parse:
    version.failure: 
      en: "Failed to parse version argument"
    any:
      en: "Failed to parse %{item}"